[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layeris-python"
version = "0.1.0"
description = "Layeris Python Inference Engine: Multi-Layer MoE Expert Prediction, Predictive Prefetching & Speculative Decoding"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Layeris Systems Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
inference = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
layeris-benchmark = "layeris.prefetch.benchmark:main"
layeris-chat = "layeris.inference.chat:main"

[tool.setuptools.packages.find]
where = ["src"]
